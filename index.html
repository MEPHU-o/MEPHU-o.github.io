/* ---------- สีพื้นฐาน ---------- */
:root {
  --bg:#0b1020;
  --line:#24304f;
  --text:#e8edf7;
  --muted:#93a1c0;
  --surface:rgba(255,255,255,.05);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

/* ---------- ธีม ---------- */
:root,
[data-theme="ocean"] {
  --accent:#00f5d4;
  --accent-soft:#0077ff;
  --glow1:#102b4c;

}

[data-theme="sunset"] {

  --glow1:#4a2418;
  --glow2:#5c2b10;
}

[data-theme="forest"] {

  --accent-soft:#10b981;
  --glow1:#14342a;
  --glow2:#0f3d2e;
}

[data-theme="grape"] {

  --accent-soft:#a855f7;
  --glow1:#2e1d52;
  --glow2:#3d1a5c;
}

[data-theme="mono"] {
  --accent:#e2e8f0;
  --accent-soft:#cbd5e1;
  --glow1:#1e293b;
  --glow2:#0f172a;
}

[data-theme="mono-light"] {
  --accent:#334155;
  --accent-soft:#475569;
  --glow1:#dbe3ee;
  --glow2:#e6ebf3;
  --bg:#f7f9fc;
  --line:#ccd6e4;
  --text:#0f172a;
  --muted:#52627d;
  --surface:rgba(15,23,42,.04);
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:"Segoe UI","Noto Sans Thai",system-ui,sans-serif;
  line-height:1.75;
  background:
    radial-gradient(
      1000px 460px at 12% -10%,
      var(--glow1) 0,
      transparent 60%
    ),
    radial-gradient(
      820px 400px at 92% 0,
      var(--glow2) 0,
      transparent 55%
    ),
    var(--bg);
}

/* ---------- Container ---------- */
.wrap {
  max-width:760px;
  margin:0 auto;
  padding:0 22px 80px;
}

/* ---------- Hero ---------- */
.hero {
  display:flex;
  gap:22px;
  align-items:center;
  padding:64px 0 8px;
  flex-wrap:wrap;
}

.avatar {
  width:96px;
  height:96px;
  border-radius:50%;
  border:2px solid var(--accent);
  object-fit:cover;
  flex-shrink:0;
  background:var(--surface);
  box-shadow:0 0 30px rgba(0,245,212,.18);
}

.avatar-fallback {
  width:96px;
  height:96px;
  border-radius:50%;
  flex-shrink:0;
  border:2px solid var(--accent);
  background:var(--surface);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:600;
  color:var(--accent);
}

.hero-text {
  flex:1;
  min-width:240px;
}

.role {
  font:600 12px/1 var(--mono);
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 8px;
}

h1 {
  font-size:clamp(30px,6vw,46px);
  line-height:1.15;
  margin:0 0 8px;
  letter-spacing:-.02em;
}

.tagline {
  font-size:clamp(17px,2.6vw,20px);
  color:var(--text);
  margin:0;
  opacity:.92;
}

.about {
  color:var(--muted);
  margin:26px 0 0;
  max-width:62ch;
}

/* ---------- Links ---------- */
.links {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:0;
  margin:24px 0 0;
  list-style:none;
}

.links a {
  display:inline-block;
  border:1px solid var(--line);
  border-radius:999px;
  padding:9px 20px;
  color:var(--text);
  text-decoration:none;
  font-size:15px;
  transition:
    border-color .15s ease,
    color .15s ease,
    box-shadow .15s ease;
}

.links a:hover,
.links a:focus-visible {
  border-color:var(--accent);
  color:var(--accent);
  box-shadow:0 0 15px rgba(0,245,212,.12);
}

/* ---------- Sections ---------- */
section {
  margin-top:52px;
}

h2 {
  font:600 12px/1 var(--mono);
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
  border-bottom:1px solid var(--line);
  padding-bottom:10px;
  margin:0 0 20px;
}

/* ---------- Learning ---------- */
.learning {
  list-style:none;
  padding:0;
  margin:0;
}

.learning li {
  border-left:2px solid var(--accent);
  padding:2px 0 2px 16px;
  margin-bottom:14px;
  color:var(--muted);
}

/* ---------- Works ---------- */
.works {
  display:grid;
  gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
}

.work {
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px 18px;
  background:var(--surface);
  transition:
    transform .15s ease,
    border-color .15s ease,
    box-shadow .15s ease;
}

.work:hover {
  transform:translateY(-3px);
  border-color:var(--accent);
  box-shadow:0 8px 30px rgba(0,0,0,.18);
}

.work h3 {
  margin:0 0 6px;
  font-size:17px;
}

.work p {
  margin:0;
  color:var(--muted);
  font-size:14.5px;
}

.work a {
  color:var(--accent);
  text-decoration:none;
  font-size:14px;
  display:inline-block;
  margin-top:10px;
}

.work a:hover {
  text-decoration:underline;
}

.empty {
  border:1px dashed var(--line);
  border-radius:12px;
  padding:26px 20px;
  color:var(--muted);
  text-align:center;
  font-size:15px;
}

/* ---------- Network Panel ---------- */
.panel {
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--surface);
  padding:4px 20px 16px;
}

.row {
  display:grid;
  grid-template-columns:minmax(130px,1fr) minmax(0,1.5fr);
  gap:12px;
  padding:11px 0;
  border-bottom:1px dashed var(--line);
  align-items:baseline;
}

.row:last-of-type {
  border-bottom:0;
}

.row dt {
  color:var(--muted);
  font-size:14px;
  margin:0;
}

.row dd {
  margin:0;
  font-family:var(--mono);
  font-size:14px;
  color:var(--accent);
  word-break:break-all;
}

.row .note {
  display:block;
  color:var(--muted);
  font-family:inherit;
  font-size:12.5px;
}

.hint {
  color:var(--muted);
  font-size:14px;
  margin:14px 0 0;
}

/* ---------- Footer ---------- */
footer {
  margin-top:56px;
  padding-top:22px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:14px;
}

footer a {
  color:var(--accent);
}

/* ---------- Mobile ---------- */
@media (max-width:520px) {

  .hero {
    padding-top:44px;
    gap:16px;
  }

  .avatar,
  .avatar-fallback {
    width:72px;
    height:72px;
    font-size:28px;
  }

  .row {
    grid-template-columns:1fr;
    gap:2px;
  }

}
</style>
</head>
